services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stocktrader-api
    ports:
      - "3000:5239"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5239/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  desktop-app:
    build:
      context: .
      dockerfile: Dockerfile.desktop-prod
    container_name: stocktrader-desktop
    ports:
      - "8000:8000"
    environment:
      - VITE_API_URL=http://api:5239
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
