services:
  stocktrader-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: stock-trader/api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/data/stocktrader.db
      ML__ModelDirectory: /data/ml_models
      Alpaca__ApiKey: ${ALPACA_API_KEY:-}
      Alpaca__ApiSecret: ${ALPACA_API_SECRET:-}
      Alpaca__IsPaper: ${ALPACA_IS_PAPER:-true}
      Alpaca__EnableStreaming: ${ALPACA_ENABLE_STREAMING:-false}
      OptimizationWorkerTransport__Enabled: ${OPTIMIZATION_WORKER_TRANSPORT_ENABLED:-false}
      OptimizationWorkerTransport__LeaseTransportEnabled: ${OPTIMIZATION_WORKER_LEASES_ENABLED:-false}
      OptimizationWorkerTransport__Mode: Shadow
      OptimizationWorkerTransport__SharedSecret: ${OPTIMIZATION_WORKER_SHARED_SECRET:-}
    ports:
      - "5239:5239"
    volumes:
      - stocktrader_data:/data
    restart: unless-stopped

  desktop:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    image: stock-trader/desktop:local
    depends_on:
      stocktrader-api:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  optimization-worker:
    build:
      context: .
      dockerfile: Dockerfile.optimization-worker
    image: stock-trader/optimization-worker:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      STOCKTRADER_CONTROL_API_URL: http://stocktrader-api:5239
      STOCKTRADER_WORKER_ID: compose-optimization-worker
      STOCKTRADER_WORKER_SECRET: ${OPTIMIZATION_WORKER_SHARED_SECRET:-}
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  stocktrader_data:
