apiVersion: v1
kind: ServiceAccount
metadata:
  name: stocktrader-optimization-worker
  namespace: stocktrader
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocktrader-optimization-worker
  namespace: stocktrader
  labels:
    app: stocktrader-optimization-worker
    stocktrader.io/mode: shadow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: stocktrader-optimization-worker
  template:
    metadata:
      labels:
        app: stocktrader-optimization-worker
        stocktrader.io/mode: shadow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: stocktrader-optimization-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: localhost/stock-trader/optimization-worker:latest
        imagePullPolicy: Never
        ports:
        - name: health
          containerPort: 8080
        env:
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: STOCKTRADER_CONTROL_API_URL
          value: "https://stocktrader-api:3443"
        - name: STOCKTRADER_WORKER_CLIENT_CERT_PATH
          value: "/tls/client/tls.crt"
        - name: STOCKTRADER_WORKER_CLIENT_KEY_PATH
          value: "/tls/client/tls.key"
        - name: STOCKTRADER_WORKER_SERVER_CA_PATH
          value: "/tls/client/ca.crt"
        - name: STOCKTRADER_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: STOCKTRADER_WORKER_SECRET
          valueFrom:
            secretKeyRef:
              name: stocktrader-optimization-worker-auth
              key: shared-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "2"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: optimization-worker-client-tls
          mountPath: /tls/client
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: optimization-worker-client-tls
        secret:
          secretName: __OPTIMIZATION_WORKER_CLIENT_TLS_SECRET__
