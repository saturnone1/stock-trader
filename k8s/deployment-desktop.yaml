apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocktrader-desktop
  namespace: stocktrader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stocktrader-desktop
  template:
    metadata:
      labels:
        app: stocktrader-desktop
    spec:
      containers:
      - name: desktop
        image: localhost/stock-trader/desktop:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: stocktrader-desktop
  namespace: stocktrader
spec:
  selector:
    app: stocktrader-desktop
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stocktrader-desktop
  namespace: stocktrader
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  rules:
  - host: "__STOCKTRADER_HOST__"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: stocktrader-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stocktrader-desktop
            port:
              number: 8000
