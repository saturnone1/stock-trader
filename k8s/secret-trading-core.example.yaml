apiVersion: v1
kind: Secret
metadata:
  name: stocktrader-trading-core-auth
  namespace: stocktrader
type: Opaque
stringData:
  shared-secret: replace-with-at-least-32-random-bytes

---
apiVersion: v1
kind: Secret
metadata:
  name: stocktrader-trading-core-encryption
  namespace: stocktrader
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  encryption-key: replace-with-base64-encoded-32-byte-key
