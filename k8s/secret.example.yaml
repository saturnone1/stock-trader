apiVersion: v1
kind: Secret
metadata:
  name: stocktrader-secrets
  namespace: stocktrader
type: Opaque
stringData:
  # Alpaca Markets API — https://alpaca.markets/
  ALPACA_API_KEY: "YOUR_ALPACA_API_KEY"
  ALPACA_API_SECRET: "YOUR_ALPACA_API_SECRET"

  # LS Securities (optional)
  LS_APP_KEY: ""
  LS_APP_SECRET: ""
  LS_ACCOUNT_NO: "00000000"
  LS_ACCOUNT_PASSWORD: "0000"

  # Telegram (optional)
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""

  # Discord (optional)
  DISCORD_WEBHOOK_URL: ""

  # Email (optional)
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
