apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stocktrader-ml-training
  namespace: stocktrader
spec:
  podSelector:
    matchLabels:
      app: stocktrader-ml-training
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: stocktrader-api
    ports:
    - protocol: TCP
      port: 8443
  - ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
