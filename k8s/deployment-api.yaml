apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocktrader-api
  namespace: stocktrader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocktrader-api
  template:
    metadata:
      labels:
        app: stocktrader-api
    spec:
      containers:
      - name: api
        image: localhost/stock-trader/api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5239
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          value: "Data Source=/data/stocktrader.db"
        - name: ML__ModelDirectory
          value: "/data/ml_models"
        - name: ALPACA__APIKEY
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__ApiKey
        - name: ALPACA__APISECRET
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__ApiSecret
        - name: ALPACA__ISPAPER
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__IsPaper
        - name: ALPACA__ENABLESTREAMING
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__EnableStreaming
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: stocktrader-data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5239
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5239
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: stocktrader-data
        hostPath:
          path: __STOCKTRADER_DATA_DIR__
          type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: stocktrader-api
  namespace: stocktrader
spec:
  selector:
    app: stocktrader-api
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 5239
  type: ClusterIP
