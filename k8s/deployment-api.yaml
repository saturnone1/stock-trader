apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocktrader-api
  namespace: stocktrader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocktrader-api
  template:
    metadata:
      labels:
        app: stocktrader-api
        stocktrader.io/broker-egress: "__API_BROKER_EGRESS_LABEL__"
    spec:
      containers:
      - name: api
        image: localhost/stock-trader/api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5239
        - name: worker-tls
          containerPort: 5443
        - name: cutover-tls
          containerPort: 5543
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          value: "Data Source=/data/stocktrader.db"
        - name: ML__ModelDirectory
          value: "/data/ml_models"
        - name: ALPACA__APIKEY
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__ApiKey
        - name: ALPACA__APISECRET
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__ApiSecret
        - name: ALPACA__ISPAPER
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__IsPaper
        - name: ALPACA__ENABLESTREAMING
          valueFrom:
            secretKeyRef:
              name: stocktrader-alpaca
              key: Alpaca__EnableStreaming
        - name: OptimizationWorkerTransport__Enabled
          value: "true"
        - name: OptimizationWorkerTransport__LeaseTransportEnabled
          value: "__OPTIMIZATION_WORKER_LEASE_TRANSPORT_ENABLED__"
        - name: OptimizationWorkerTransport__Mode
          value: "__OPTIMIZATION_WORKER_MODE__"
        - name: OptimizationWorkerTransport__LeaseSeconds
          value: "60"
        - name: OptimizationWorkerTransport__RemotePollMilliseconds
          value: "1000"
        - name: OptimizationWorkerTransport__MaxConcurrentRemoteJobs
          value: "__OPTIMIZATION_WORKER_CONCURRENCY__"
        - name: OptimizationWorkerTransport__SharedSecret
          valueFrom:
            secretKeyRef:
              name: stocktrader-optimization-worker-auth
              key: shared-secret
        - name: OptimizationWorkerTransport__ClientCertificateAuthorityPath
          value: "/tls/client-ca/ca.crt"
        - name: OptimizationWorkerTransport__ClientCertificateCommonName
          value: "stocktrader-optimization-worker"
        - name: Kestrel__Endpoints__WorkerHttps__Url
          value: "https://+:5443"
        - name: Kestrel__Endpoints__PublicHttp__Url
          value: "http://+:5239"
        - name: Kestrel__Endpoints__WorkerHttps__Certificate__Path
          value: "/tls/server/tls.crt"
        - name: Kestrel__Endpoints__WorkerHttps__Certificate__KeyPath
          value: "/tls/server/tls.key"
        - name: Kestrel__Endpoints__WorkerHttps__ClientCertificateMode
          value: "AllowCertificate"
        - name: MarketDataTransport__Mode
          value: "__MARKET_DATA_MODE__"
        - name: MarketDataTransport__Endpoint
          value: "https://stocktrader-market-data:7443"
        - name: MarketDataTransport__ClientCertificatePath
          value: "/tls/market-data-client/tls.crt"
        - name: MarketDataTransport__ClientCertificateKeyPath
          value: "/tls/market-data-client/tls.key"
        - name: MarketDataTransport__ServerCertificateAuthorityPath
          value: "/tls/market-data-client/ca.crt"
        - name: MarketDataTransport__ServerCertificateCommonName
          value: "stocktrader-market-data"
        - name: MarketDataTransport__ShadowBackfillEnabled
          value: "__MARKET_DATA_SHADOW_BACKFILL_ENABLED__"
        - name: MlTrainingTransport__Mode
          value: "__ML_TRAINING_MODE__"
        - name: MlTrainingTransport__Endpoint
          value: "https://stocktrader-ml-training:8443"
        - name: MlTrainingTransport__SharedSecret
          valueFrom:
            secretKeyRef:
              name: stocktrader-ml-training-auth
              key: shared-secret
        - name: MlTrainingTransport__ClientCertificatePath
          value: "/tls/ml-training-client/tls.crt"
        - name: MlTrainingTransport__ClientCertificateKeyPath
          value: "/tls/ml-training-client/tls.key"
        - name: MlTrainingTransport__ServerCertificateAuthorityPath
          value: "/tls/ml-training-client/ca.crt"
        - name: MlTrainingTransport__ServerCertificateCommonName
          value: "stocktrader-ml-training"
        - name: TradingCoreTransport__Mode
          value: "__TRADING_CORE_MODE__"
        - name: TradingCoreTransport__Endpoint
          value: "https://stocktrader-trading-core:9443"
        - name: TradingCoreTransport__ClientCertificatePath
          value: "/tls/trading-core-client/tls.crt"
        - name: TradingCoreTransport__ClientCertificateKeyPath
          value: "/tls/trading-core-client/tls.key"
        - name: TradingCoreTransport__ServerCertificateAuthorityPath
          value: "/tls/trading-core-client/ca.crt"
        - name: TradingCoreTransport__ServerCertificateCommonName
          value: "stocktrader-trading-core"
        - name: EdgeTransitionControl__Enabled
          value: "__EDGE_TRANSITION_CONTROL_ENABLED__"
        - name: EdgeTransitionControl__ServerCertificatePath
          value: "/tls/edge-cutover-server/tls.crt"
        - name: EdgeTransitionControl__ServerCertificateKeyPath
          value: "/tls/edge-cutover-server/tls.key"
        - name: EdgeTransitionControl__ClientCertificateAuthorityPath
          value: "/tls/edge-cutover-client-ca/ca.crt"
        - name: EdgeTransitionControl__CoordinatorRoleDnsName
          value: "trading-cutover-coordinator.stocktrader.internal"
        - name: AuthorityCapabilityAttestation__RuntimeProfile
          value: "__API_RUNTIME_PROFILE__"
        - name: AuthorityCapabilityAttestation__ImageDigest
          value: "__API_IMAGE_DIGEST__"
        - name: AuthorityCapabilityAttestation__ServiceInventoryHash
          value: "__API_SERVICE_INVENTORY_HASH__"
        - name: AuthorityCapabilityAttestation__SecretReferenceHash
          value: "__API_SECRET_REFERENCE_HASH__"
        - name: AuthorityCapabilityAttestation__NetworkPolicyHash
          value: "__API_NETWORK_POLICY_HASH__"
        - name: AuthorityCapabilityAttestation__HasBrokerEgress
          value: "__API_HAS_BROKER_EGRESS__"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: stocktrader-data
          mountPath: /data
        - name: optimization-worker-server-tls
          mountPath: /tls/server
          readOnly: true
        - name: optimization-worker-client-ca
          mountPath: /tls/client-ca
          readOnly: true
        - name: market-data-client-tls
          mountPath: /tls/market-data-client
          readOnly: true
        - name: ml-training-client-tls
          mountPath: /tls/ml-training-client
          readOnly: true
        - name: trading-core-client-tls
          mountPath: /tls/trading-core-client
          readOnly: true
        - name: edge-cutover-server-tls
          mountPath: /tls/edge-cutover-server
          readOnly: true
        - name: edge-cutover-client-ca
          mountPath: /tls/edge-cutover-client-ca
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 5239
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5239
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: stocktrader-data
        hostPath:
          path: __STOCKTRADER_DATA_DIR__
          type: DirectoryOrCreate
      - name: optimization-worker-server-tls
        secret:
          secretName: __OPTIMIZATION_WORKER_SERVER_TLS_SECRET__
      - name: optimization-worker-client-ca
        secret:
          secretName: __OPTIMIZATION_WORKER_CLIENT_TLS_SECRET__
          items:
          - key: ca.crt
            path: ca.crt
      - name: market-data-client-tls
        secret:
          secretName: __MARKET_DATA_CLIENT_TLS_SECRET__
      - name: ml-training-client-tls
        secret:
          secretName: __ML_TRAINING_CLIENT_TLS_SECRET__
      - name: trading-core-client-tls
        secret:
          secretName: __TRADING_CORE_CLIENT_TLS_SECRET__
      - name: edge-cutover-server-tls
        secret:
          secretName: __EDGE_CUTOVER_SERVER_TLS_SECRET__
      - name: edge-cutover-client-ca
        secret:
          secretName: __CUTOVER_COORDINATOR_CLIENT_TLS_SECRET__
          items:
          - key: ca.crt
            path: ca.crt

---
apiVersion: v1
kind: Service
metadata:
  name: stocktrader-api
  namespace: stocktrader
spec:
  selector:
    app: stocktrader-api
  ports:
  - name: public-http
    protocol: TCP
    port: 3000
    targetPort: 5239
  - name: worker-tls
    protocol: TCP
    port: 3443
    targetPort: 5443
  - name: cutover-tls
    protocol: TCP
    port: 3543
    targetPort: 5543
  type: ClusterIP
