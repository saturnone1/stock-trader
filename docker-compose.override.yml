# =============================================================================
# docker-compose.override.yml  — Development overrides
#
# Docker Compose automatically merges this file on top of docker-compose.yml
# when you run  `docker compose up`  (no extra flags needed).
#
# This file is intentionally NOT used in CI/CD pipelines.  Production
# deployments use  `docker compose -f docker-compose.yml up -d`  to skip it.
# =============================================================================

services:
  stocktrader:
    # ── Development build ────────────────────────────────────────────────────
    build:
      context: .
      dockerfile: Dockerfile
      # Optionally target only the build stage for faster iteration:
      # target: build

    # ── Development environment variables ────────────────────────────────────
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"

      # More verbose logging in development (Serilog overrides)
      Serilog__MinimumLevel__Default: "Debug"
      Serilog__MinimumLevel__Override__Microsoft.AspNetCore: "Information"
      Serilog__MinimumLevel__Override__StockTrader.BackgroundServices: "Debug"
      Serilog__MinimumLevel__Override__StockTrader.Services.Patterns: "Debug"
      Serilog__MinimumLevel__Override__StockTrader.Services.ML: "Debug"
      Serilog__MinimumLevel__Override__StockTrader.Services.Broker: "Debug"

      # Use a separate development database so test trades don't pollute prod data.
      ConnectionStrings__DefaultConnection: "Data Source=/data/stocktrader_dev.db"

      # Keep streaming disabled in dev by default — prevents noise from Alpaca.
      Alpaca__EnableStreaming: "false"

    # ── Port mapping ─────────────────────────────────────────────────────────
    # Expose an extra port for debugging if needed (e.g., dotnet watch).
    ports:
      - "5239:5239"

    # ── Volume mounts ────────────────────────────────────────────────────────
    # Mount the local source tree so that file changes can be inspected
    # inside the container without rebuilding the image.
    # NOTE: This does NOT enable hot-reload; you still need to rebuild/restart
    # the container after code changes.  For true hot-reload use dotnet watch
    # on the host instead.
    volumes:
      - db_data_dev:/data
      - ml_models_dev:/app/ml_models
      - logs_dev:/app/Logs
      # Read-only source mount for log inspection and config tweaks.
      - .:/workspace:ro

    # ── Restart policy ───────────────────────────────────────────────────────
    # "no" in dev so that the container doesn't auto-restart after crashes —
    # you want to see the exit code and investigate.
    restart: "no"

    # ── Resource limits ──────────────────────────────────────────────────────
    # Relaxed limits in development; let the process use what it needs.
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: "4G"
        reservations:
          cpus: "0.25"
          memory: "128M"

# =============================================================================
# Named Volumes (development variants — separate from production volumes)
# =============================================================================
volumes:
  db_data_dev:
    driver: local
  ml_models_dev:
    driver: local
  logs_dev:
    driver: local
