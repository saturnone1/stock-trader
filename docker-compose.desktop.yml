services:
  # Desktop App Build (Node.js + Svelte)
  desktop-app:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:5239
    volumes:
      - ./desktop-app:/app
      - /app/node_modules
    command: npm run dev

  # API Server (unchanged from main setup)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:5239"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./:/app

volumes:
  node_modules:
