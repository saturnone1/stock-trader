name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      # Only rebuild when application code or Docker config changes.
      # Skips pure-doc or workflow-only pushes.
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'appsettings.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stocktrader

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Buildx setup ───────────────────
      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # ── Registry Login ────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (optional - only runs if secrets are configured)
      - name: Log in to Docker Hub (optional)
        uses: docker/login-action@v3
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      # ── Image Metadata ────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # short commit SHA (sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # full commit SHA
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=StockTrader
            org.opencontainers.image.description=Automated stock trading system (Blazor Server)
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # ── Build & Push ──────────────────────────
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Layer caching via GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args: embed git SHA and build date into image
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

      # ── Summary ───────────────────────────────
      - name: Write job summary
        run: |
          echo "## Docker Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key      | Value |"                                                        >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|"                                                        >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | \`${{ env.REGISTRY }}\`"                                       >> "$GITHUB_STEP_SUMMARY"
          echo "| Image    | \`${{ env.IMAGE_NAME }}\`"                                     >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest   | \`${{ steps.build-push.outputs.digest }}\`"                    >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags     | \`latest\`, \`sha-${{ github.sha }}\`"                        >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pull Commands" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
