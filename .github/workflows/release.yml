name: Release

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.0, v2.3.1-beta, etc.

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_NAME: StockTrader

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build & Test (gate before release)
  # ──────────────────────────────────────────────
  test:
    name: Run Tests (Release gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore & Test
        run: |
          dotnet restore trader.sln
          dotnet test tests/StockTrader.Tests/StockTrader.Tests.csproj \
            --configuration Release \
            --logger "console;verbosity=normal"

  # ──────────────────────────────────────────────
  # Job 2: Publish Binaries (matrix: win-x64 / linux-x64)
  # ──────────────────────────────────────────────
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: StockTrader-win-x64
            ext: .exe
          - rid: linux-x64
            artifact: StockTrader-linux-x64
            ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore StockTrader.csproj

      - name: Publish self-contained (${{ matrix.rid }})
        run: >
          dotnet publish StockTrader.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish/${{ matrix.rid }}
          /p:PublishSingleFile=true
          /p:PublishTrimmed=false
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Create ZIP archive
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../${{ matrix.artifact }}-${{ github.ref_name }}.zip .
        # Windows runner would need 7z; ubuntu ships zip natively

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip
          retention-days: 1   # only needed until GitHub Release is created

  # ──────────────────────────────────────────────
  # Job 3: Docker Build + Push (GHCR)
  # ──────────────────────────────────────────────
  docker-release:
    name: Build & Push Docker Image (release tag)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also push to Docker Hub if secrets are set
      - name: Log in to Docker Hub (optional)
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/stocktrader
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ──────────────────────────────────────────────
  # Job 4: Create GitHub Release
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish, docker-release]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for changelog generation

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -30)
          fi
          # Escape multiline string for GitHub Actions output
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG"           >> "$GITHUB_OUTPUT"
          echo "EOF"            >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StockTrader ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## StockTrader ${{ github.ref_name }}

            ### What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Downloads
            | Platform     | File                                              |
            |--------------|---------------------------------------------------|
            | Windows x64  | `StockTrader-win-x64-${{ github.ref_name }}.zip`  |
            | Linux x64    | `StockTrader-linux-x64-${{ github.ref_name }}.zip` |

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/stocktrader:${{ github.ref_name }}
            ```

            > **Note**: Requires Alpaca API keys in `appsettings.json` before running.
          files: release-assets/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # v1.0.0-beta → prerelease
          generate_release_notes: false
